name: Catalog post-release verification

on:
  push:
    branches:
      - main

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for deployment window
        run: sleep 1800

      - name: Check out verification source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public commit and workers
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          PUBLIC_HEALTH_URL: http://203.205.90.232:8765/healthz
          CHECK_COUNT: "256"
          EXPECTED_WORKERS: "8"
        run: |
          set -euo pipefail
          workers_file="$(mktemp)"
          trap 'rm -f "$workers_file"' EXIT
          public_commit=""
          for attempt in $(seq 1 "$CHECK_COUNT"); do
            payload="$(curl --fail --silent --show-error --max-time 15 --connect-timeout 5 \
              --header 'Cache-Control: no-cache' --header 'Connection: close' \
              "${PUBLIC_HEALTH_URL}?post_release_check=${GITHUB_RUN_ID}-${attempt}")"
            worker_pid="$(PAYLOAD="$payload" python3 <<'PY'
          import json
          import os

          payload = json.loads(os.environ["PAYLOAD"])
          expected_commit = os.environ["EXPECTED_COMMIT"].lower()
          errors = []
          release_commit = payload.get("release_commit")
          if not isinstance(release_commit, str) or len(release_commit) < 40:
              errors.append(f"invalid public commit {release_commit!r}")
          if payload.get("runtime_mode") != "production":
              errors.append(f"runtime mode is {payload.get('runtime_mode')!r}")
          if not payload.get("production_runtime_ready"):
              errors.append("production runtime is not ready")
          if "gunicorn" not in str(payload.get("server_software") or "").lower():
              errors.append(f"server is {payload.get('server_software')!r}")
          worker_pid = payload.get("worker_pid")
          if not isinstance(worker_pid, int) or worker_pid <= 0:
              errors.append(f"invalid worker pid {worker_pid!r}")
          if errors:
              raise SystemExit("; ".join(errors))
          print(f"{release_commit} {worker_pid}")
          PY
            )"
            observed_commit="${worker_pid%% *}"
            observed_pid="${worker_pid##* }"
            if [ -z "$public_commit" ]; then
              public_commit="$observed_commit"
            elif [ "$public_commit" != "$observed_commit" ]; then
              echo "Public workers returned mixed commits: $public_commit and $observed_commit." >&2
              exit 1
            fi
            printf '%s\n' "$observed_pid" >> "$workers_file"
          done
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$EXPECTED_COMMIT" "$public_commit"; then
            echo "Public commit $public_commit does not contain expected release $EXPECTED_COMMIT." >&2
            exit 1
          fi
          observed_workers="$(sort -u "$workers_file" | wc -l | tr -d ' ')"
          if [ "$observed_workers" -lt "$EXPECTED_WORKERS" ]; then
            echo "Only observed $observed_workers workers; expected at least $EXPECTED_WORKERS." >&2
            exit 1
          fi
          echo "Public deployment $public_commit contains $EXPECTED_COMMIT across $observed_workers workers."
