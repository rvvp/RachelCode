name: Explicit application release verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Independent server acceptance owns production verification
        run: |
          echo 'Production verification is performed by the installed isolated dispatcher and local publisher.'
          echo 'A repository commit does not require Catalog, Planning and Replenishment to run the same SHA.'
          echo 'This workflow does not contact, restart or roll back any production application.'
