<!doctype html>
<html lang="zh-CN">
<head>
<style>
    :root {
      --bg: #f6f1e8;
      --paper: rgba(255, 251, 245, 0.9);
      --paper-strong: rgba(255, 248, 238, 0.98);
      --paper-soft: rgba(255, 255, 255, 0.74);
      --ink: #241b14;
      --muted: #786d62;
      --line: rgba(94, 67, 40, 0.14);
      --accent: #bc6c25;
      --accent-strong: #7f3b08;
      --accent-deep: #355f52;
      --success: #2f6f55;
      --warning: #9d612d;
      --shadow: 0 28px 70px rgba(88, 56, 31, 0.12);
      --shadow-soft: 0 12px 32px rgba(102, 72, 44, 0.08);
      --radius: 28px;
      --radius-sm: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(228, 177, 108, 0.28), transparent 24%),
        radial-gradient(circle at 88% 16%, rgba(56, 111, 100, 0.14), transparent 20%),
        radial-gradient(circle at 78% 88%, rgba(181, 106, 45, 0.16), transparent 22%),
        linear-gradient(180deg, #fbf7f1 0%, var(--bg) 54%, #f4ede3 100%);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.14) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.18), transparent 75%);
    }
    a { color: var(--accent-strong); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1440px; margin: 0 auto; padding: 24px 24px 64px; }
    .page-back-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: -6px 0 18px;
    }
    .page-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(94, 67, 40, 0.12);
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow-soft);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    .page-back-link:hover {
      text-decoration: none;
      background: rgba(255,255,255,0.96);
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(91, 58, 29, 0.10);
    }
    .page-back-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .department-monitor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin: -10px 0 18px;
      padding: 13px 16px;
      border: 1px solid rgba(181, 106, 45, 0.16);
      border-radius: 18px;
      background: rgba(255, 249, 240, 0.74);
      box-shadow: var(--shadow-soft);
    }
    .department-monitor-title {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }
    .department-monitor-title strong {
      font-size: 14px;
      color: var(--accent-strong);
    }
    .department-monitor-title span {
      color: var(--muted);
      font-size: 13px;
    }
    .department-monitor-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .department-monitor-button,
    .department-monitor-exit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 13px;
      border-radius: 11px;
      border: 1px solid rgba(94, 67, 40, 0.12);
      background: rgba(255,255,255,0.78);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .department-monitor-button:hover,
    .department-monitor-exit:hover {
      text-decoration: none;
      background: rgba(255,255,255,0.98);
    }
    .department-monitor-button-active {
      border-color: rgba(181, 106, 45, 0.38);
      background: rgba(226, 187, 134, 0.28);
      color: var(--accent-strong);
    }
    .department-monitor-button-disabled {
      color: rgba(120, 109, 98, 0.64);
      background: rgba(255,255,255,0.44);
      cursor: not-allowed;
    }
    .department-monitor-exit {
      color: var(--accent-strong);
      border-color: rgba(181, 106, 45, 0.22);
    }
    .nav-shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr;
      gap: 20px;
      align-items: center;
      padding: 24px 26px;
      background: linear-gradient(180deg, rgba(255,251,245,0.9), rgba(255,248,239,0.82));
      border: 1px solid rgba(94, 67, 40, 0.1);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      margin-bottom: 26px;
      position: sticky;
      top: 12px;
      z-index: 20;
      overflow: visible;
      isolation: isolate;
    }
    .nav-shell::before {
      content: "远山含黛色，玲珑晓楼阁";
      position: absolute;
      left: 50%;
      top: 52%;
      z-index: 0;
      color: rgba(91, 62, 35, 0.008);
      font-family: "STXingkaiSC-Light", "行楷-简 细体", "STXingkai", "WangXizhi", "王羲之行书", "FZXingKai-S04S", "STKaiti", cursive;
      font-size: 30px;
      font-weight: 400;
      font-synthesis: none;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }
    .nav-shell > * {
      position: relative;
      z-index: 1;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff8ee;
      background:
        linear-gradient(135deg, var(--accent) 0%, #d59647 50%, var(--accent-deep) 100%);
      box-shadow: 0 14px 30px rgba(96, 64, 35, 0.18);
    }
    .brand-mark-seal {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      padding: 8px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-align: center;
      color: #92541e;
      white-space: normal;
      background: rgba(255, 251, 245, 0.78);
      border: 1px solid rgba(188, 108, 37, 0.2);
      box-shadow:
        0 8px 18px rgba(102, 72, 44, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.64);
    }
    .brand-mark-seal .brand-mark-label {
      display: inline-block;
      transform: translateX(-2px);
    }
    .brand {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      color: rgba(36, 27, 20, 0.76);
    }
    .brand-hidden-label {
      display: none;
    }
    .brand-subline {
      margin-top: 2px;
      font-size: 44px;
      font-weight: 780;
      letter-spacing: 0.02em;
      line-height: 1.02;
      color: #6d3410;
      text-shadow: 0 1px 2px rgba(82, 41, 16, 0.08);
    }
    .brand-subline-seal {
      font-family: "WeibeiSC-Bold", "魏碑-简", "WeibeiTC-Bold", "魏碑-繁", serif;
      font-variant-east-asian: traditional;
    }
    .meta {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.6;
    }
    .meta-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      flex-wrap: wrap;
      width: 100%;
    }
    .nav-session {
      display: inline-flex;
      align-items: stretch;
      gap: 10px;
      margin-left: auto;
    }
    .nav-role {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 16px;
      min-width: 170px;
      border-radius: 18px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(94, 67, 40, 0.12);
      box-shadow: var(--shadow-soft);
    }
    .nav-role strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
    }
    .nav-role-note {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
      margin: 0;
      padding: 0;
      justify-content: flex-end;
      flex: 1 1 480px;
    }
    .nav-chip {
      position: relative;
      padding: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(140, 90, 43, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
    }
    .nav-chip a {
      display: inline-flex;
      align-items: center;
      padding: 11px 16px;
      font-weight: 600;
    }
    .nav-chip-dropdown {
      overflow: visible;
    }
    .nav-menu {
      position: relative;
    }
    .nav-menu summary {
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      font-weight: 600;
      color: var(--accent-strong);
      cursor: pointer;
      user-select: none;
    }
    .nav-menu summary::-webkit-details-marker {
      display: none;
    }
    .nav-menu summary::after {
      content: "▾";
      font-size: 12px;
      color: var(--muted);
      transition: transform 160ms ease;
    }
    .nav-menu[open] summary::after {
      transform: rotate(-180deg);
    }
    .nav-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 230px;
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 22px;
      background: rgba(255, 250, 244, 0.98);
      border: 1px solid rgba(94, 67, 40, 0.12);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      z-index: 20;
    }
    .nav-dropdown::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 10px;
    }
    .nav-dropdown a,
    .nav-dropdown-link {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(94, 67, 40, 0.1);
    }
    .nav-dropdown a:hover {
      text-decoration: none;
      background: rgba(255,255,255,0.98);
      transform: translateY(-1px);
    }
    .nav-dropdown-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .nav-dropdown-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .nav-dropdown-link-disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }
    .panel {
      background: linear-gradient(180deg, var(--paper) 0%, rgba(255, 249, 242, 0.94) 100%);
      border: 1px solid rgba(94, 67, 40, 0.1);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px;
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(232, 183, 126, 0.18), transparent 72%);
      pointer-events: none;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(340px, 0.85fr);
      gap: 20px;
      margin-bottom: 22px;
    }
    .billing-admin-hero {
      grid-template-columns: minmax(0, 1fr);
      margin-bottom: 16px;
    }
    .billing-admin-hero .panel > p {
      max-width: 920px;
      margin-bottom: 0;
    }
    .hero h1, .panel h1, .panel h2, .panel h3 { margin-top: 0; }
    .eyebrow {
      display: none;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .stat-card {
      padding: 18px 18px 16px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,247,236,0.96)),
        linear-gradient(135deg, rgba(181,106,45,0.08), rgba(46,95,88,0.05));
      border: 1px solid rgba(94, 67, 40, 0.1);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: "";
      position: absolute;
      right: -14px;
      top: -14px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(181,106,45,0.12), rgba(46,95,88,0.02));
    }
    .stat-card strong {
      display: block;
      font-size: 32px;
      margin-top: 12px;
      line-height: 1;
    }
    .stat-card span {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 13px;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .tools form {
      display: grid;
      grid-template-columns: minmax(220px, 1.3fr) repeat(3, minmax(150px, 0.8fr)) minmax(130px, 0.7fr);
      gap: 10px;
      width: 100%;
    }
    input, select, textarea, button {
      width: 100%;
      font: inherit;
      border-radius: 16px;
      border: 1px solid rgba(91, 58, 29, 0.14);
      padding: 13px 15px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(181, 106, 45, 0.12);
      border-color: rgba(181, 106, 45, 0.46);
    }
    textarea { min-height: 112px; resize: vertical; }
    button {
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      box-shadow: 0 16px 28px rgba(91, 58, 29, 0.18);
    }
    button:hover {
      transform: translateY(-1px);
      filter: saturate(1.05);
    }
    .ghost-button {
      background: rgba(255,255,255,0.78);
      color: var(--ink);
      box-shadow: none;
      border-color: rgba(91, 58, 29, 0.12);
    }
    .ghost-danger {
      min-width: 108px;
      height: 100%;
      padding-inline: 18px;
      background: rgba(255,255,255,0.84);
    }
    .export-menu {
      position: relative;
    }
    .export-menu[open] {
      z-index: 3;
    }
    .export-menu-compact {
      display: inline-flex;
    }
    .export-menu-summary {
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      min-height: 48px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 16px 28px rgba(91, 58, 29, 0.18);
      user-select: none;
    }
    .export-menu-summary-compact {
      padding: 11px 16px;
      min-height: 0;
      box-shadow: none;
      background: rgba(255,255,255,0.78);
      color: var(--ink);
      border: 1px solid rgba(91, 58, 29, 0.12);
    }
    .export-menu-summary-compact::after {
      color: var(--muted);
    }
    .export-menu-summary::-webkit-details-marker {
      display: none;
    }
    .export-menu-summary::after {
      content: "▾";
      font-size: 12px;
      opacity: 0.9;
    }
    .export-menu-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 190px;
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 18px;
      background: rgba(255, 251, 245, 0.98);
      border: 1px solid rgba(94, 67, 40, 0.12);
      box-shadow: var(--shadow-soft);
    }
    .export-menu-panel::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 10px;
    }
    .export-menu-item {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid rgba(91, 58, 29, 0.1);
      background: rgba(255,255,255,0.86);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      box-shadow: none;
    }
    .export-menu-item:hover {
      text-decoration: none;
      background: rgba(255,247,236,0.96);
      transform: none;
      filter: none;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-wide {
      grid-column: 1 / -1;
    }
    .table-wrap {
      overflow-x: auto;
      max-width: 100%;
      border-radius: 22px;
      border: 1px solid rgba(94, 67, 40, 0.12);
      background: rgba(255,255,255,0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.54);
    }
    .products-list-scroll-wrap {
      position: relative;
      max-height: clamp(360px, 56vh, 600px);
      overflow-x: auto;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(127, 59, 8, 0.55) rgba(188, 108, 37, 0.08);
    }
    .products-list-scroll-wrap::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    .products-list-scroll-wrap::-webkit-scrollbar-track {
      background: rgba(188, 108, 37, 0.08);
      border-radius: 999px;
    }
    .products-list-scroll-wrap::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(127, 59, 8, 0.78), rgba(188, 108, 37, 0.54));
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.72);
    }
    .products-list-scroll-wrap::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(127, 59, 8, 0.88), rgba(188, 108, 37, 0.68));
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      background: rgba(255,255,255,0.56);
    }
    th, td {
      padding: 15px 14px;
      border-bottom: 1px solid rgba(94, 67, 40, 0.1);
      text-align: left;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      background: rgba(247, 241, 233, 0.96);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .catalog-table {
      width: max-content;
      min-width: 100%;
      table-layout: fixed;
      min-width: 1180px;
      background: rgba(255,255,255,0.9);
    }
    .catalog-table thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      white-space: nowrap;
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 10px 18px 10px 10px;
      text-align: center;
      vertical-align: middle;
      overflow: visible;
      box-shadow: inset 0 -1px 0 rgba(94, 67, 40, 0.08);
    }
    .catalog-table tbody tr {
      transition: background 160ms ease;
    }
    .catalog-table tbody tr:nth-child(even) {
      background: rgba(248, 243, 236, 0.48);
    }
    .catalog-table tbody tr:hover {
      background: rgba(255, 248, 238, 0.92);
    }
    .catalog-table td {
      padding: 8px 10px;
      vertical-align: middle;
      font-size: 13px;
      line-height: 1.32;
    }
    .catalog-table .table-id-cell,
    .catalog-table .table-status-cell,
    .catalog-table .table-version-cell,
    .catalog-table .table-days-cell,
    .catalog-table .table-initiator-cell,
    .catalog-table .table-owner-cell,
    .catalog-table .table-user-cell,
    .catalog-table .table-updated-cell,
    .catalog-table .table-actions-cell {
      white-space: nowrap;
    }
    .catalog-table .table-id-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(53, 95, 82, 0.08);
      color: var(--accent-deep);
      font-weight: 700;
    }
    .catalog-table .table-cell-text,
    .catalog-table .table-cell-link {
      display: -webkit-box;
      max-width: 168px;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
      line-height: 1.32;
    }
    .catalog-table .table-cell-link {
      color: var(--accent-deep);
      text-decoration: none;
      font-weight: 600;
    }
    .catalog-table .table-cell-link:hover {
      text-decoration: underline;
    }
    .catalog-table .table-cell-empty {
      display: block;
      min-height: 14px;
    }
    .catalog-table .table-cell-mono {

  <script>
    
    document.querySelectorAll("details").forEach(function(menu) {
      let closeTimer = null;
      const cancelPendingClose = function() {
        if (closeTimer !== null) {
          window.clearTimeout(closeTimer);
          closeTimer = null;
        }
      };
      menu.addEventListener("pointerenter", cancelPendingClose);
      menu.addEventListener("pointerleave", function(event) {
        if (event.pointerType === "mouse") {
          cancelPendingClose();
          closeTimer = window.setTimeout(function() {
            menu.open = false;
            closeTimer = null;
          }, 180);
        }
      });
      menu.addEventListener("focusout", function(event) {
        if (!(event.relatedTarget instanceof Node) || !menu.contains(event.relatedTarget)) {
          cancelPendingClose();
          menu.open = false;
        }
      });
      menu.addEventListener("toggle", function() {
        if (menu.open) {
          document.querySelectorAll("details[open]").forEach(function(otherMenu) {
            if (otherMenu !== menu) {
              otherMenu.open = false;
            }
          });
        }
        if (!menu.open) {
          cancelPendingClose();
        }
      });
    });
    document.addEventListener("click", async function(event) {
      const target = event.target;
      if (!(target instanceof HTMLElement)) {
        return;
      }
      const copyText = target.getAttribute("data-copy-text");
      if (!copyText) {
        return;
      }
      try {
        await navigator.clipboard.writeText(copyText);
        const original = target.textContent;
        target.textContent = "已复制";
        setTimeout(function() {
          target.textContent = original;
        }, 1200);
      } catch (error) {
        console.error(error);
      }
    });
  </script>
